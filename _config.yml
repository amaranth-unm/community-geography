title: Center for Community Geography
name: R.H. Mallory Center for Community Geography
description: Connecting University of New Mexico resources with community needs through
  service learning, collaborative mapping, place-based research, and public events.
lang: en
timezone: America/Denver
url: https://amaranth.unm.edu
baseurl: /community-geography
repository: amaranth-unm/community-geography
repository_url: https://github.com/amaranth-unm/community-geography
email: communitygeography@unm.edu
theme_css: unm
search: true
unm_gtm_id: GTM-WQT2MB
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
- jekyll-sitemap
- jekyll-redirect-from
defaults:
# Every page uses the Center's UNM layout unless a rule below says otherwise.
- scope:
    path: ''
  values:
    layout: base-unm
# Breadcrumbs: pages in each folder link back to their section's main page.
- scope:
    path: pages/about
  values:
    section: About
    section_url: /about/
- scope:
    path: pages/get-involved
  values:
    section: Get Involved
    section_url: /get-involved/
- scope:
    path: pages/news
  values:
    section: News
    section_url: /news/
- scope:
    path: pages/events
  values:
    section: Events
    section_url: /events/
- scope:
    path: pages/projects
  values:
    section: Projects
    section_url: /projects/
# Placeholder photos for the band at the top of each kind of page, until a page
# sets its own `masthead_image:`. All four are free to use without credit; their
# sources are kept here. Each is cropped to a wide strip and compressed, and is
# otherwise unchanged. All are on Wikimedia Commons.
#   projects  placeholder-sandia-panorama.jpg  BrandonStephenson, CC0
#             File:Sandia_Peak_dramatic_angle_(9399721497).jpg
#   events    placeholder-sandia-bosque.jpg    BrandonStephenson, public domain
#             File:Sandia_Mountains_(49952516771).jpg
#   news      placeholder-hands-on-map.jpg     Joshua Tree National Park (NPS), public domain
#             File:Looking_at_a_Map_(17301857542).jpg
#   lexicon   placeholder-bosque-river.jpg     BrandonStephenson, CC0
#             File:Sunset_Sandias_Bosque_(31865031022).jpg
- scope:
    path: ''
    type: projects
  values:
    layout: project-unm
    section: Projects
    section_url: /projects/
    masthead_image: /assets/images/masthead/placeholder-sandia-panorama.jpg
    masthead_position: 50% 50%
- scope:
    path: ''
    type: events
  values:
    layout: event-unm
    section: Events
    section_url: /events/
    masthead_image: /assets/images/masthead/placeholder-sandia-bosque.jpg
    masthead_position: 50% 50%
- scope:
    path: ''
    type: news
  values:
    layout: news-unm
    section: News
    section_url: /news/
    masthead_image: /assets/images/masthead/placeholder-hands-on-map.jpg
    masthead_position: 50% 50%
- scope:
    path: ''
    type: lexicon
  values:
    layout: lexicon-unm
    section: Community Geography
    section_url: /about/community-geography
    masthead_image: /assets/images/masthead/placeholder-bosque-river.jpg
    masthead_position: 50% 50%
exclude:
- README.md
- LICENSE
- Gemfile
- Gemfile.lock
- vendor/
- scripts/
- .bundle/
collections:
  events:
    output: true
    permalink: /events/:title
  news:
    output: true
    permalink: /news/:title
  people:
    output: false
  # Every project, current and past. A project counts as past once its
  # end_date has gone by (see _includes/helpers/split-projects.html).
  projects:
    output: true
    permalink: /projects/project/:name
  # The Community Geography lexicon: one file per word, shown as a card on the
  # Community Geography page and as a page of its own (_layouts/lexicon-unm.html).
  lexicon:
    output: true
    permalink: /community-geography/:name-lexicon-word
# The Center's name as a transparent image (text only; the UNM mark is not
# part of it). It is drawn in white over the home photos and on the masthead.
center_logo:
  image: /assets/images/site/center-name-text.png
  width: 1059
  height: 113
  alt: R.H. Mallory Center for Community Geography
# The photo in the band at the top of every page but the home page is set per
# page, with `masthead_image:` (and optionally `masthead_position:`) in its
# front matter. News stories, events, projects and lexicon words start with the
# placeholder set in the defaults above; any other page without the line has no
# photo.
home_hero:
  images:
  - /assets/images/masthead/hero-badlands.jpg
  - /assets/images/masthead/community-gis-day-2025.jpg
  - /assets/images/masthead/hero-sandia-bosque.jpg
  - /assets/images/masthead/human-geography-gis-day-2023.jpg
