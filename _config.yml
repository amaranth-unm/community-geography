title: Center for Community Geography
name: R.H. Mallory Center for Community Geography
description: Connecting University of New Mexico resources with community needs through
  service learning, collaborative mapping, place-based research, and public events.
lang: en
timezone: America/Denver
url: https://amaranth.unm.edu
baseurl: /community-geography
repository: amaranth-unm/community-geography
repository_url: https://github.com/amaranth-unm/community-geography
email: communitygeography@unm.edu
theme_css: unm
search: true
unm_gtm_id: GTM-WQT2MB
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
- jekyll-sitemap
- jekyll-redirect-from
defaults:
# Every page uses the Center's UNM layout unless a rule below says otherwise.
- scope:
    path: ''
  values:
    layout: base-unm
# Breadcrumbs: pages in each folder link back to their section's main page.
- scope:
    path: pages/about
  values:
    section: About
    section_url: /about/
- scope:
    path: pages/community-geography
  values:
    section: Community
    section_url: /community-geography/
- scope:
    path: pages/funding
  values:
    section: Funding
    section_url: /funding/
- scope:
    path: pages/news
  values:
    section: News
    section_url: /news/
- scope:
    path: pages/events
  values:
    section: Events
    section_url: /events/archive
- scope:
    path: pages/projects
  values:
    section: Projects
    section_url: /projects/
- scope:
    path: ''
    type: projects
  values:
    layout: project-unm
    section: Projects
    section_url: /projects/
- scope:
    path: ''
    type: events
  values:
    layout: event-unm
    section: Events
    section_url: /events/archive
- scope:
    path: ''
    type: news
  values:
    layout: news-unm
    section: News
    section_url: /news/
- scope:
    path: ''
    type: lexicon
  values:
    layout: lexicon-unm
    section: Community
    section_url: /community-geography/
exclude:
- README.md
- HOW-TO-EDIT-THIS-WEBSITE.md
- LICENSE
- Gemfile
- Gemfile.lock
- vendor/
- scripts/
- .bundle/
collections:
  events:
    output: true
    permalink: /events/:title
  news:
    output: true
    permalink: /news/:title
  people:
    output: false
  # Every project, current and past. A project counts as past once its
  # end_date has gone by (see _includes/helpers/split-projects.html).
  projects:
    output: true
    permalink: /projects/project/:name
  # The Community Geography lexicon: one file per word, shown as a card on the
  # Community Geography page and as a page of its own (_layouts/lexicon-unm.html).
  lexicon:
    output: true
    permalink: /community-geography/:name-lexicon-word
center_banner:
  image: /assets/images/shared/center-logo-.png
  width: 1920
  height: 300
  alt: R.H. Mallory Center for Community Geography, University of New Mexico
# Home page photos, shown in turn behind the Center's logo. Keep exactly four:
# the fade timing in assets/css/community.css (.center-hero) is set for four.
# To change a photo, replace one line with the path of the new picture.
home_hero:
  logo: /assets/images/hero/center-logo-text-transparent.png
  images:
  - /assets/images/hero/hero-badlands.jpg
  - /assets/images/hero/hero-organ-mountains.jpg
  - /assets/images/hero/hero-sandia-bosque.jpg
  - /assets/images/hero/hero-lava-field.jpg
# Recent News on the home page: how many of the newest stories to show.
# Use 0 to hide the section.
home_news_count: 3
