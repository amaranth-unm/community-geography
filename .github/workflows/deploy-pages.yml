name: Deploy Jekyll site to Pages

# Pushes to main build, check, and publish. Pull requests into main run the
# same build and checks but never publish.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages
        if: github.event_name != 'pull_request'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Configure the published address
        if: github.event_name != 'pull_request'
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: ruby -ryaml -e 'File.write("_config.ci.yml", {"url" => ENV.fetch("PAGES_ORIGIN"), "baseurl" => ENV.fetch("PAGES_BASE_PATH")}.to_yaml)'
      - name: Build
        env:
          JEKYLL_ENV: production
        # Pull requests use the address in _config.yml; publishing uses the one Pages reports.
        run: bundle exec jekyll build --strict_front_matter --config _config.yml${{ github.event_name != 'pull_request' && ',_config.ci.yml' || '' }}
      - name: Check internal links, images, and search index
        run: bundle exec ruby scripts/check-site.rb _site
      - name: Check collection records and calendar boundaries
        run: |
          bundle exec ruby scripts/check-collections.rb _site
          bundle exec ruby scripts/test-event-dates.rb
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
